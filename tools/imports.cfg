# Asphalt 6: Adrenaline HD (com.gameloft.android.HEP.GloftA6HP): one native
# library, the 32-bit Gameloft build (SONAME libjni.so) that the APK carries
# as libguest_asphalt6.so.
MODULES libguest_asphalt6.so
# ctype / wctype / libm whose bionic and newlib ABIs agree.
PASSTHROUGH isprint ldexpf
PASSTHROUGH iswalpha iswcntrl iswdigit iswlower iswprint iswpunct iswspace iswupper iswxdigit
